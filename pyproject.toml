[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search-lite"
version = "2.0.0"
description = "Completely free web search + content extraction for AI agents (zero API keys)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Agent Search Lite Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27.0",
    "rich>=13.0",
    "loguru>=0.7.0",
]

[project.optional-dependencies]
ddgs = ["ddgs>=4.0"]

[project.scripts]
agent-search-lite = "agent_search.cli:main"
asearch = "agent_search.cli:main"

[project.urls]
Homepage = "https://github.com/itsPremkumar/agent-search-lite"
Documentation = "https://github.com/itsPremkumar/agent-search-lite"
Repository = "https://github.com/itsPremkumar/agent-search-lite"

[tool.setuptools.packages.find]
include = ["agent_search*"]
exclude = ["tests*", "docs*"]
