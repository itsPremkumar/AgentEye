[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-search-lite"
version = "6.3.0"
description = "Completely free web search + content extraction for AI agents"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Agent Search Lite Contributors"},
]
keywords = ["search", "ai", "agent", "free", "web", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "ddgs>=9.0.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0.0"]
all = ["mcp>=1.0.0"]

[project.scripts]
agent-search-lite = "agent_search.core:main"
agent-search-mcp = "agent_search.mcp_server:main"

[project.urls]
Homepage = "https://github.com/itsPremkumar/agent-search-lite"
Repository = "https://github.com/itsPremkumar/agent-search-lite"
Issues = "https://github.com/itsPremkumar/agent-search-lite/issues"

[tool.setuptools.packages.find]
include = ["agent_search*"]
