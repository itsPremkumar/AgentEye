[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eye"
version = "6.4.0"
description = "Complete internet data access for AI agents — zero API keys, zero cost"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "AgentEye Contributors"},
]
keywords = ["search", "ai", "agent", "free", "web", "mcp", "eye"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "pyyaml>=6.0",
    "trafilatura>=1.12.0",
]

[project.optional-dependencies]
ddgs = ["ddgs>=9.0.0"]
mcp = ["mcp>=1.0.0"]
api = ["fastapi>=0.110.0", "uvicorn[standard]>=0.27.0"]
test = ["pytest>=7.0.0", "respx>=0.21.0", "responses>=0.23.0"]
all = ["ddgs>=9.0.0", "mcp>=1.0.0", "fastapi>=0.110.0", "uvicorn[standard]>=0.27.0", "pytest>=7.0.0", "respx>=0.21.0"]

[project.scripts]
agent-eye = "agent_eye.core:main"
agent-eye-mcp = "agent_eye.mcp_server:main"
agent-eye-api = "agent_eye.api:main"

[project.urls]
Homepage = "https://github.com/itsPremkumar/AgentEye"
Repository = "https://github.com/itsPremkumar/AgentEye"
Issues = "https://github.com/itsPremkumar/AgentEye/issues"

[tool.setuptools.packages.find]
include = ["agent_eye*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra -q --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "network: marks tests that require network access",
]

[tool.ruff]
line-length = 120
target-version = "py39"
